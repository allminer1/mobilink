[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "linkstat"  # working name; taken on PyPI by an unrelated tool, to be renamed before any release
version = "0.2.0.dev0"
description = "Chance-corrected, read-length-robust co-localization of gene classes on long reads and contigs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "click>=8.1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Development Status :: 2 - Pre-Alpha",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
adapters = ["edlib>=1.3"]  # `linkstat chimeras --reads`: adapters inside reads

[project.scripts]
linkstat = "linkstat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linkstat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
