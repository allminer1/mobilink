# Draft for bioconda-recipes/recipes/mobilink/meta.yaml. Not submitted.
# Before submission: publish the release on PyPI, then fill in the sha256 of the sdist and the GitHub user name
# (marked FILL below).
{% set name = "mobilink" %}
{% set version = "0.5.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: FILL

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  entry_points:
    - mobilink = mobilink.cli:main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.10
    - pip
    - hatchling >=1.20
  run:
    - python >=3.10
    - numpy >=1.24
    - scipy >=1.10
    - pandas >=2.0
    - click >=8.1
    - edlib >=1.3

test:
  imports:
    - mobilink
  commands:
    - mobilink --version
    - mobilink test --help

about:
  home: https://github.com/FILL/mobilink
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Chance-corrected, read-length-robust co-localization of gene classes on long reads and contigs
  description: |
    mobilink tests whether two gene classes (for example antibiotic resistance genes and mobile genetic elements)
    sit close together on long reads or contigs more often than chance, and estimates the net linked fraction, an
    effect size that does not depend on read length.
  dev_url: https://github.com/FILL/mobilink

extra:
  recipe-maintainers:
    - FILL
